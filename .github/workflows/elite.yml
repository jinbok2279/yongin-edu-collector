name: elite

on:
  schedule:
    - cron: "10 21 1 * *"   # 한국시간 매달 2일 06:10
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: elite
  cancel-in-progress: false

jobs:
  elite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python elite.py
        env:
          NEIS_KEY: ${{ secrets.NEIS_KEY }}
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p docs/data && cp output/elite.json docs/data/
          git add output/elite.json docs/data/elite.json
          git diff --cached --quiet && exit 0
          git commit -m "특목·자사고 목록 업데이트"
          for i in 1 2 3; do git pull --rebase && git push && break; sleep 5; done
