name: deals

on:
  schedule:
    - cron: "15 21 * * *"   # 매일 06:15 (한국시간)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deals
  cancel-in-progress: false

jobs:
  deals:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -u deals.py
        env:
          CITY: 용인
          KAKAO_KEY: ${{ secrets.KAKAO_KEY }}
      - run: |
          [ -f output/deals.json ] || exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p docs/data && cp output/deals.json docs/data/
          git add output/deals.json docs/data/deals.json
          git diff --cached --quiet && exit 0
          git commit -m "동네 할인 업데이트"
          for i in 1 2 3; do git pull --rebase && git push && break; sleep 5; done
