name: jobs

on:
  schedule:
    - cron: "40 21 * * *"   # 한국시간 매일 06:40
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: jobs
  cancel-in-progress: false

jobs:
  jobs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python jobs.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p docs/data && cp output/jobs.json docs/data/
          git add output/jobs.json docs/data/jobs.json
          git diff --cached --quiet && exit 0
          git commit -m "엄마 일자리 업데이트"
          for i in 1 2 3; do git pull --rebase && git push && break; sleep 5; done
