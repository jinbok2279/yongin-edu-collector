name: kinder

on:
  schedule:
    - cron: "50 20 * * 0"   # 한국시간 매주 월요일 05:50
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: kinder
  cancel-in-progress: false

jobs:
  kinder:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python kinder.py
        env:
          KINDER_KEY: ${{ secrets.KINDER_KEY }}
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p docs/data && cp output/kinder.json docs/data/
          git add output/kinder.json docs/data/kinder.json
          git diff --cached --quiet && exit 0
          git commit -m "유치원 정보 업데이트"
          for i in 1 2 3; do git pull --rebase && git push && break; sleep 5; done
