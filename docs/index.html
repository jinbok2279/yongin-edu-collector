<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#5161F7">
<meta name="description" content="용인시 초·중·고등학교 학사일정과 교육 정보를 한곳에서">
<title>용인 맘 교육알림</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&display=swap">
<style>
:root{
  --ink:#141A2E;--muted:#5C6478;--line:#EEF0F6;--ground:#EEF1F8;
  --indigo:#4B5BF0;--indigo-ink:#3442C9;--coral-ink:#C93D22;--coral-bg:#FFE9E2;
  --mint-ink:#13795F;--mint-bg:#E2F6F0;--sun-ink:#8A5300;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--ground);color:var(--ink);font-family:'Noto Sans KR',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100vh}
button,input{font-family:inherit}
a{color:var(--indigo);text-decoration:none}
.bg{position:fixed;inset:0;z-index:-1;background:radial-gradient(circle at 90% 4%,rgba(150,135,255,.38),transparent 42%),radial-gradient(circle at 0% 62%,rgba(110,220,195,.26),transparent 45%),var(--ground)}
.wrap{max-width:560px;margin:0 auto;padding:20px 18px calc(110px + env(safe-area-inset-bottom))}
.lift{background:#fff;border-radius:24px;box-shadow:inset 0 1px 0 #fff,0 1px 2px rgba(20,26,46,.05),0 14px 30px -12px rgba(43,52,120,.24)}
.glass{background:rgba(255,255,255,.66);backdrop-filter:blur(20px) saturate(1.4);-webkit-backdrop-filter:blur(20px) saturate(1.4);border:1px solid rgba(255,255,255,.85)}
.tile{display:inline-flex;align-items:center;justify-content:center;color:#fff;border-radius:14px;flex:0 0 auto;box-shadow:inset 0 2px 1px rgba(255,255,255,.55),inset 0 -4px 8px rgba(0,0,0,.16),0 10px 18px -6px var(--sh)}
.t-indigo{background:linear-gradient(155deg,#9AA4FF,#5B6BFF 45%,#3B47D6);--sh:rgba(75,91,240,.6)}
.t-coral{background:linear-gradient(155deg,#FFBBA5,#FF7A59 50%,#DD4E33);--sh:rgba(255,122,89,.6)}
.t-mint{background:linear-gradient(155deg,#9BF0DC,#2FC4A4 50%,#16917A);--sh:rgba(43,181,154,.55)}
.t-sun{background:linear-gradient(155deg,#FFE9A6,#FFC53D 50%,#E79B00);--sh:rgba(240,170,20,.55)}
.t-lilac{background:linear-gradient(155deg,#E3C9FF,#AE7BFA 50%,#7E4ED8);--sh:rgba(167,116,242,.55)}
.orb-sun{border-radius:50%;background:radial-gradient(circle at 30% 26%,#fff 0%,#FFF1C4 14%,#FFD15A 45%,#F2A900 78%,#C98500 100%);box-shadow:0 18px 26px -12px rgba(30,10,80,.55)}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
.fl{animation:float 5s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){.fl{animation:none}}
.btn{border:none;border-radius:16px;height:46px;padding:0 18px;font-size:14px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn-3d{background:linear-gradient(180deg,#6876FF,#4B5BF0);color:#fff;box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 4px 0 #3340C4,0 12px 18px -8px rgba(75,91,240,.6)}
.btn-soft{background:linear-gradient(180deg,#fff,#F2F4FB);color:var(--ink);box-shadow:inset 0 1px 0 #fff,0 4px 0 #DCE0EE,0 10px 16px -8px rgba(43,52,120,.3)}
.btn:active{transform:translateY(3px)}
.chip{display:inline-flex;align-items:center;gap:6px;height:40px;padding:0 14px;border-radius:20px;font-size:13px;font-weight:700;color:var(--ink)}
h1,h2,h3{margin:0;letter-spacing:-.4px}
.section{display:flex;flex-direction:column;gap:12px;margin-top:26px}
.sec-head{display:flex;justify-content:space-between;align-items:baseline}
.sec-head h2{font-size:19px;font-weight:800}
.sec-head a,.sec-head button{font-size:13px;font-weight:700;color:var(--indigo);background:none;border:none;cursor:pointer;padding:6px 0}
.hero{position:relative;overflow:hidden;border-radius:30px;padding:24px;min-height:200px;color:#fff;background:linear-gradient(140deg,#5161F7,#6B55E8 55%,#8A5BE6);box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 26px 40px -18px rgba(75,91,240,.7)}
.hero .glow{position:absolute;left:-60px;top:-80px;width:240px;height:240px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.22),transparent 65%)}
.hero .date{font-size:12px;opacity:.85;font-weight:500}
.hero h1{font-size:23px;font-weight:800;line-height:1.38;margin-top:8px;max-width:72%;white-space:pre-line}
.hero .next{margin:6px 0 0;font-size:15px;font-weight:500;opacity:.92;max-width:62%;line-height:1.5}
.hero .cta{margin-top:14px;height:38px;padding:0 16px;border-radius:19px;background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.45);color:#fff;font-size:13px;font-weight:700;cursor:pointer}
.hero .deco{position:absolute;right:20px;top:20px}
.hero .dday{position:absolute;right:18px;bottom:20px;text-align:center;background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.4);border-radius:20px;padding:10px 14px;min-width:84px}
.hero .dday b{display:block;font-size:26px;font-weight:800;line-height:1.1}
.hero .dday span{font-size:11px;opacity:.9}
.ev{display:flex;gap:14px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.ev:last-child{border-bottom:none}
.datebox{width:54px;height:54px;border-radius:16px;flex:0 0 auto;background:linear-gradient(180deg,#fff,#EEF0FA);box-shadow:inset 0 -3px 0 #DDE1F0,0 6px 12px -6px rgba(43,52,120,.35);display:flex;flex-direction:column;align-items:center;justify-content:center}
.datebox b{font-size:18px;font-weight:800;color:var(--indigo-ink);line-height:1.1}
.datebox span{font-size:10px;font-weight:700;color:var(--muted)}
.datebox.hol b{color:var(--coral-ink)}
.ev-body{flex:1;min-width:0}
.ev-name{font-size:15px;font-weight:700;line-height:1.4}
.ev-sub{font-size:12px;color:var(--muted);margin-top:2px}
.pill{font-size:12px;font-weight:800;padding:4px 10px;border-radius:12px;white-space:nowrap}
.pill-coral{color:var(--coral-ink);background:var(--coral-bg)}
.pill-indigo{color:var(--indigo-ink);background:#ECEEFF}
.pill-mint{color:var(--mint-ink);background:var(--mint-bg)}
.pill-gray{color:#3A4256;background:#EEF0F6}
.card-pad{padding:6px 18px}
.empty{padding:18px;font-size:14px;color:var(--muted);line-height:1.7}
.soon{display:flex;gap:14px;align-items:center;padding:16px 18px}
.soon p{margin:2px 0 0;font-size:13px;color:var(--muted);line-height:1.5}
.search{display:flex;align-items:center;gap:10px;height:52px;padding:0 18px;border-radius:18px}
.search input{flex:1;border:none;outline:none;background:transparent;font-size:15px;color:var(--ink)}
.school{display:flex;gap:14px;align-items:center;padding:14px 16px;width:100%;text-align:left;border:none;background:#fff;cursor:pointer;border-bottom:1px solid var(--line);color:var(--ink)}
.school:last-child{border-bottom:none}
.school .nm{font-size:15px;font-weight:700}
.school .ad{font-size:12px;color:var(--muted);margin-top:2px}
.school.mine{background:#F4F5FF}
.list{overflow:hidden}
.back{width:44px;height:44px;border-radius:22px;display:inline-flex;align-items:center;justify-content:center;color:var(--ink);cursor:pointer}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px;min-height:56px;border-bottom:1px solid var(--line);font-size:15px}
.row:last-child{border-bottom:none}
.row .val{font-size:13px;color:var(--muted);text-align:right}
.foot{margin-top:26px;font-size:11px;color:var(--muted);line-height:1.7;text-align:center}
.nav{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom));width:min(524px,calc(100% - 28px));height:70px;border-radius:35px;display:flex;align-items:center;padding:0 6px;box-shadow:0 18px 40px -14px rgba(43,52,120,.38);z-index:10}
.navi{flex:1;height:62px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--muted);font-size:11px;font-weight:700;background:none;border:none;cursor:pointer}
.navi .ic{width:34px;height:34px;display:flex;align-items:center;justify-content:center;border-radius:12px}
.navi.on{color:var(--indigo-ink)}
.navi.on .ic{color:#fff;background:linear-gradient(155deg,#9AA4FF,#5B6BFF 45%,#3B47D6);box-shadow:inset 0 2px 1px rgba(255,255,255,.55),inset 0 -4px 8px rgba(0,0,0,.16),0 8px 14px -6px rgba(75,91,240,.6)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:100px;background:#141A2E;color:#fff;font-size:13px;padding:10px 16px;border-radius:14px;z-index:20;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:.92}
.seatbar{height:12px;border-radius:6px;background:#EEF0F6;box-shadow:inset 0 2px 3px rgba(20,26,46,.12);overflow:hidden}
.seatbar i{display:block;height:100%;border-radius:6px}
.lib-card{padding:18px;display:flex;flex-direction:column;gap:12px}
.room{display:flex;flex-direction:column;gap:6px}
.room-top{display:flex;justify-content:space-between;align-items:baseline;font-size:14px}
.room-top b{font-size:20px;font-weight:800}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.stat{background:#F5F7FC;border-radius:14px;padding:10px 6px;text-align:center;box-shadow:inset 0 1px 2px rgba(20,26,46,.06)}
.stat .k{font-size:11px;color:var(--muted)}.stat .v{font-size:18px;font-weight:800;margin-top:2px}
.dots{display:grid;grid-template-columns:repeat(auto-fill,minmax(11px,1fr));gap:3px}
.dots i{display:block;aspect-ratio:1;border-radius:3px;border:1.5px solid var(--dot);background:#fff}
.dots i.u{background:var(--dot);border-color:var(--dot-ink)}
.loading{padding:60px 0;text-align:center;color:var(--muted);font-size:14px}
</style>
</head>
<body>
<div class="bg"></div>
<main class="wrap" id="view"><div class="loading">불러오는 중…</div></main>

<nav class="nav glass" aria-label="주요 메뉴">
  <button class="navi" data-tab="home"><span class="ic"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5V21h-6v-6H9v6H3z"/></svg></span>홈</button>
  <button class="navi" data-tab="schools"><span class="ic"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></svg></span>학교 일정</button>
  <button class="navi" data-tab="library"><span class="ic"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M5 4h11a3 3 0 0 1 3 3v13H8a3 3 0 0 1-3-3z"/><path d="M5 17a3 3 0 0 1 3-3h11"/></svg></span>도서관</button>
  <button class="navi" data-tab="my"><span class="ic"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-7 8-7s8 3 8 7"/></svg></span>마이</button>
</nav>
<div class="toast" id="toast" role="status"></div>

<script>
const DATA_URL = "https://raw.githubusercontent.com/jinbok2279/yongin-edu-collector/main/output/latest.json";
const KEY_SCHOOL = "edu.school";
const SEATS_URL = "https://raw.githubusercontent.com/jinbok2279/yongin-edu-collector/main/output/seats.json";
const KEY_SEATS = "edu.seats";
let SEATS = null;
const KEY_DATA = "edu.data";
const KEY_REGION = "edu.region";
const GUS = ["수지구", "기흥구", "처인구"];
const KEY_LEVEL = "edu.level";
const LEVELS = [["초등학교", "초등"], ["중학교", "중등"], ["고등학교", "고등"]];
const IMPORTANT = /휴업|방학|개학|졸업|입학|체험|기념일|운동회|한마당|발표회|축제|상담|공개수업/;
const WD = ["일","월","화","수","목","금","토"];
const $view = document.getElementById("view");
let DATA = null;
let installEvt = null;

function store(k, v) { try { if (v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); } catch (e) { return null; } }
function esc(s) { return String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c])); }
function toast(msg) { const t = document.getElementById("toast"); t.textContent = msg; t.classList.add("show"); setTimeout(() => t.classList.remove("show"), 1800); }

function parseDate(s) { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); }
function today() { const n = new Date(); return new Date(n.getFullYear(), n.getMonth(), n.getDate()); }
function dday(s) { return Math.round((parseDate(s) - today()) / 86400000); }
function ddayText(n) { return n === 0 ? "오늘" : n > 0 ? `D-${n}` : `D+${-n}`; }
function md(s) { const d = parseDate(s); return `${d.getMonth() + 1}.${d.getDate()}`; }
function mdw(s) { const d = parseDate(s); return `${d.getMonth() + 1}.${d.getDate()} (${WD[d.getDay()]})`; }

// 같은 이름의 연속 일정(예: ○○ 주간)을 하나로 묶기
function group(events) {
  const out = [];
  [...events].sort((a, b) => a.date.localeCompare(b.date) || a.name.localeCompare(b.name)).forEach(e => {
    const prev = out.find(g => g.name === e.name && (parseDate(e.date) - parseDate(g.end)) / 86400000 <= 3);
    if (prev) prev.end = e.date; else out.push({ ...e, end: e.date });
  });
  return out.sort((a, b) => a.date.localeCompare(b.date));
}
function upcoming(list) { return list.filter(g => dday(g.end) >= 0); }

// ---------- 지역(구 · 읍면동) ----------
function region() { try { return JSON.parse(store(KEY_REGION) || "{}"); } catch (e) { return {}; } }
function setRegion(gu, dong) { store(KEY_REGION, JSON.stringify({ gu: gu || "", dong: dong || "" })); }
function dongOf(s) { return s.dong || "기타"; }
function levelOf(s) { return s.level || "초등학교"; }
function level() { const v = store(KEY_LEVEL); return LEVELS.some(l => l[0] === v) ? v : "초등학교"; }
function levelLabel() { return (LEVELS.find(l => l[0] === level()) || LEVELS[0])[1]; }
function levelSchools() { return DATA.schools.filter(s => levelOf(s) === level()); }
function inRegion(s) { const r = region(); return levelOf(s) === level() && (!r.gu || s.gu === r.gu) && (!r.dong || dongOf(s) === r.dong); }
function regionLabel() { const r = region(); return r.gu ? `용인 ${r.gu}${r.dong ? " " + r.dong : ""}` : "용인시 전체"; }
function regionSchools() { return DATA.schools.filter(inRegion); }

// ---------- 우리 아이(여러 명) ----------
const KEY_KIDS = "edu.kids";
const KID_TILES = ["t-indigo", "t-coral", "t-mint", "t-sun", "t-lilac"];
const KID_PILLS = [["#3442C9", "#ECEEFF"], ["#C93D22", "#FFE9E2"], ["#13795F", "#E2F6F0"], ["#8A5300", "#FFF1CC"], ["#6436BE", "#F1E8FF"]];
const ORD = ["첫째", "둘째", "셋째", "넷째", "다섯째"];
const MAX_KIDS = 5;
let homeKid = "all";
let kidForm = null;
function saveKids(list) { store(KEY_KIDS, JSON.stringify(list)); }
function kids() {
  let list = [];
  try { list = JSON.parse(store(KEY_KIDS) || "[]"); } catch (e) { list = []; }
  if (!list.length) {                      // 예전 버전의 "우리 아이 학교"를 첫 번째 아이로 옮기기
    const c = store(KEY_SCHOOL);
    if (c) { list = [{ id: "k" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6), name: "우리 아이", code: c, color: 0 }]; saveKids(list); store(KEY_SCHOOL, ""); }
  }
  return list;
}
function kidSchool(k) { return DATA.schools.find(s => s.code === k.code); }
function nextColor(list) { for (let i = 0; i < KID_TILES.length; i++) if (!list.some(k => k.color === i)) return i; return list.length % KID_TILES.length; }
function kidPill(k) { const [c, b] = KID_PILLS[k.color % KID_PILLS.length]; return `<span class="pill" style="color:${c};background:${b};margin-right:6px">${esc(k.name)}</span>`; }
function levelShort(s) { return { "초등학교": "초등", "중학교": "중등", "고등학교": "고등" }[levelOf(s)] || ""; }
function kidEvents(filter) {
  const rows = [];
  kids().filter(k => filter === "all" || k.id === filter).forEach(k => {
    const s = kidSchool(k); if (!s) return;
    upcoming(group(s.events || [])).forEach(g => rows.push({ ...g, kid: k, school: s.name }));
  });
  upcoming(group((DATA.public_holidays || []).map(p => ({ ...p, holiday: true, pub: true })))).forEach(g => rows.push(g));
  return rows.sort((a, b) => a.date.localeCompare(b.date) || ((a.kid ? a.kid.color : -1) - (b.kid ? b.kid.color : -1)));
}
function schoolEvents(s) {
  const pub = (DATA.public_holidays || []).map(p => ({ ...p, holiday: true, pub: true }));
  return upcoming(group([...(s.events || []), ...pub]));
}

function evRow(g, sub, tag) {
  const n = dday(g.date);
  const range = g.end !== g.date ? `${mdw(g.date)} ~ ${md(g.end)}` : mdw(g.date);
  const d = parseDate(g.date);
  const pill = g.holiday ? `<span class="pill pill-coral">${g.pub ? "공휴일" : "휴업"}</span>`
    : `<span class="pill ${n <= 7 ? "pill-indigo" : "pill-gray"}">${ddayText(n)}</span>`;
  return `<div class="ev">
    <div class="datebox ${g.holiday ? "hol" : ""}"><b>${d.getDate()}</b><span>${d.getMonth() + 1}월 ${WD[d.getDay()]}</span></div>
    <div class="ev-body"><div class="ev-name">${esc(g.name)}</div><div class="ev-sub">${tag || ""}${esc(sub || range)}</div></div>
    ${pill}
  </div>`;
}

function regionHighlights() {
  const rows = [];
  regionSchools().forEach(s => group(s.events || []).forEach(g => {
    if ((g.holiday || IMPORTANT.test(g.name)) && dday(g.end) >= 0) rows.push({ ...g, school: s.name, code: s.code });
  }));
  return rows.sort((a, b) => a.date.localeCompare(b.date));
}

const icon = {
  pin: '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#4B5BF0" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg>',
  back: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>',
  search: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#4B5BF0" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>',
  book: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M5 4h11a3 3 0 0 1 3 3v13H8a3 3 0 0 1-3-3z"/><path d="M5 17a3 3 0 0 1 3-3h11"/></svg>',
  star: '<svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z"/></svg>'
};

function footer() {
  return `<div class="foot">데이터 · ${esc(DATA.source || "나이스 교육정보 개방포털")}<br>업데이트 ${esc(DATA.updated_at)} · 하루 3번 자동 갱신</div>`;
}

// ---------- 화면: 홈 ----------
function viewHome() {
  const ks = kids();
  if (homeKid !== "all" && !ks.some(k => k.id === homeKid)) homeKid = "all";
  const now = new Date();
  const dateStr = `${now.getMonth() + 1}월 ${now.getDate()}일 ${WD[now.getDay()]}요일`;
  let hero, mine = "";
  if (ks.length) {
    const evs = kidEvents(homeKid);

function pickGu(gu) { setRegion(gu, ""); render(); }
function pickLevel(k) { store(KEY_LEVEL, k); const r = region(); if (r.dong && !levelSchools().some(s => s.gu === r.gu && dongOf(s) === r.dong)) setRegion(r.gu, ""); render(); }
function pickDong(d) { setRegion(region().gu, d); render(); }

// ---------- 화면: 도서관 ----------
function minsAgo(ts) { if (!ts) return null; const [d, t] = ts.split(" "); const [y, m, dd] = d.split("-").map(Number); const [hh, mi] = t.split(":").map(Number); return Math.max(0, Math.round((Date.now() - new Date(y, m - 1, dd, hh, mi).getTime()) / 60000)); }
function agoText(n) { return n === null ? "" : n < 1 ? "방금" : n < 60 ? `${n}분 전` : n < 1440 ? `${Math.floor(n / 60)}시간 전` : `${Math.floor(n / 1440)}일 전`; }
function seatColor(r) { const p = r.total ? r.left / r.total : 0; return p >= 0.3 ? ["#2FC4A4", "#13795F", "여유"] : p >= 0.1 ? ["#FFC53D", "#8A5300", "보통"] : ["#FF7A59", "#C93D22", "혼잡"]; }
let libGu = null;
// 실시간 좌석을 공개하지 않는 용인시 공공도서관 (홈페이지만 안내)
const OTHER_LIBS = [["용인중앙도서관","처인구","yongin"],["남사도서관","처인구","namsa"],["모현도서관","처인구","mohyeon"],["양지해밀도서관","처인구","haemil"],["이동꿈틀도서관","처인구","idong"],
  ["구갈희망누리도서관","기흥구","gugal"],["보정도서관","기흥구","bojeong"],["영덕도서관","기흥구","yeongdeok"],["청덕도서관","기흥구","cheongdeok"],["동천도서관","수지구","dongcheon"],["성복도서관","수지구","seongbok"]];
function allLibs() {
  const seat = (SEATS && SEATS.libraries) || [];
  const names = new Set(seat.map(l => l.name));
  return seat.concat(OTHER_LIBS.filter(([n]) => !names.has(n)).map(([name, gu, code]) => ({ name, gu, status: "none", message: "", rooms: [], link: "", home: `https://lib.yongin.go.kr/${code}/index.do` })));
}
function libList() { const g = libGu ?? (region().gu || ""); return { g, list: allLibs().filter(l => !g || l.gu === g) }; }
function roomRow(r) {
  const [bar, ink, label] = seatColor(r);
  const pct = r.total ? Math.round(r.used / r.total * 100) : 0;
  return `<div class="room"><div class="room-top"><span>${esc(r.name)} <span class="pill" style="color:${ink};background:${bar}22;margin-left:4px">${label}</span></span>
    <span><b style="color:${ink}">${r.left}</b><span style="font-size:12px;color:var(--muted)"> / ${r.total}석 남음${r.wait ? " · 대기 " + r.wait : ""}</span></span></div>
    <div class="seatbar" role="img" aria-label="${esc(r.name)} ${r.total}석 중 ${r.used}석 사용"><i style="width:${pct}%;background:linear-gradient(180deg,${bar},${ink})"></i></div></div>`;
}
function libKey(l) { return encodeURIComponent(l.name); }
function libStatus(l) { const open = l.status === "open" && l.rooms.length; return { open, text: open ? "운영 중" : l.status === "none" ? "좌석 정보 없음" : (l.message || "정보 없음").replace("입니다.", "").replace(/\.$/, "") }; }
function libCard(l) {
  const { open, text } = libStatus(l);
  return `<div class="lift lib-card" role="button" tabindex="0" style="cursor:pointer" onclick="go('library/${libKey(l)}')" onkeydown="if(event.key==='Enter')go('library/${libKey(l)}')">
    <div style="display:flex;justify-content:space-between;align-items:center;gap:10px">
      <div style="display:flex;gap:12px;align-items:center"><span class="tile ${open ? "t-mint" : "t-lilac"}" style="width:42px;height:42px">${icon.book}</span>
        <div><div style="font-size:16px;font-weight:800">${esc(l.name)}</div><div style="font-size:12px;color:var(--muted)">${esc(l.gu)}</div></div></div>
      <span class="pill ${open ? "pill-mint" : "pill-gray"}">${esc(text)}</span></div>
    ${open ? l.rooms.map(roomRow).join("") : ""}
    <div class="btn btn-soft" style="height:40px;font-size:13px">자세히 보기 ›</div>
  </div>`;
}
// 좌석 칸: 사용 좌석은 채운 칸, 빈 좌석은 빈 칸 (실제 자리 위치는 아님)
function seatDots(r) {
  const [bar, ink] = seatColor(r);
  const total = Math.min(r.total, 400), used = Math.round(r.total ? r.used / r.total * total : 0);
  let s = "";
  for (let i = 0; i < total; i++) s += `<i class="${i < used ? "u" : ""}"></i>`;
  return `<div class="dots" style="--dot:${bar};--dot-ink:${ink}" aria-hidden="true">${s}</div>`;
}
function roomDetail(r) {
  const [bar, ink, label] = seatColor(r);
  const pct = r.total ? Math.round(r.used / r.total * 100) : 0;
  const stat = (k, v, c) => `<div class="stat"><div class="k">${k}</div><div class="v" ${c ? `style="color:${c}"` : ""}>${v}</div></div>`;
  return `<div class="lift lib-card">
    <div style="display:flex;justify-content:space-between;align-items:center"><div style="font-size:17px;font-weight:800">${esc(r.name)}</div>
      <span class="pill" style="color:${ink};background:${bar}22">${label} · ${pct}% 사용</span></div>
    <div style="display:flex;align-items:baseline;gap:6px"><b style="font-size:40px;font-weight:800;color:${ink};line-height:1">${r.left}</b><span style="color:var(--muted);font-size:14px">석 남음 / 전체 ${r.total}석</span></div>
    <div class="seatbar" role="img" aria-label="${esc(r.name)} ${r.total}석 중 ${r.used}석 사용"><i style="width:${pct}%;background:linear-gradient(180deg,${bar},${ink})"></i></div>
    <div class="stats">${stat("전체", r.total)}${stat("사용", r.used)}${stat("잔여", r.left, ink)}${stat("대기", r.wait || 0)}</div>
    ${seatDots(r)}
    <div style="font-size:11px;color:var(--muted)">■ 사용 중 &nbsp;□ 빈자리 · 칸은 좌석 수를 나타낸 것으로 실제 자리 위치와는 달라요</div>
  </div>`;
}
function viewLibraryDetail(key) {
  const name = decodeURIComponent(key);
  const l = allLibs().find(x => x.name === name);
  const back = `<button class="back glass" onclick="go('library')" aria-label="뒤로">${icon.back}</button>`;
  if (!l) { $view.innerHTML = back + `<div class="lift empty" style="margin-top:16px">도서관 정보를 찾지 못했어요.</div>`; return; }
  const { open, text } = libStatus(l);
  const ago = minsAgo(SEATS.updated_at);
  const sum = l.rooms.reduce((a, x) => ({ left: a.left + x.left, total: a.total + x.total, used: a.used + x.used }), { left: 0, total: 0, used: 0 });
  $view.innerHTML = `${back}
    <div style="display:flex;justify-content:space-between;align-items:flex-end;gap:10px;margin-top:14px">
      <div><h1 style="font-size:26px;font-weight:800">${esc(l.name)}</h1><p style="font-size:13px;color:var(--muted);margin-top:4px">${esc(l.gu)}${l.status === "none" ? "" : " · " + agoText(ago) + " 기준"}</p></div>
      <span class="pill ${open ? "pill-mint" : "pill-gray"}">${esc(text)}</span></div>
    ${ago !== null && ago > 90 && open ? `<div class="lift empty" style="margin-top:14px">정보가 ${agoText(ago)} 것이에요. 지금 좌석은 아래 "좌석 배치도"에서 확인하세요.</div>` : ""}
    ${open ? `<div class="lift" style="margin-top:16px;padding:18px;display:flex;justify-content:space-between;align-items:center">
        <div><div style="font-size:13px;color:var(--muted)">전체 빈자리</div><div style="font-size:30px;font-weight:800">${sum.left}<span style="font-size:15px;color:var(--muted);font-weight:600"> / ${sum.total}석</span></div></div>
        <button class="btn btn-soft" style="height:40px;font-size:13px;padding:0 14px" onclick="refreshSeats()">새로고침</button></div>
      <div style="display:flex;flex-direction:column;gap:14px;margin-top:14px">${l.rooms.map(roomDetail).join("")}</div>`
    : l.status === "none" ? `<div class="lift empty" style="margin-top:16px">이 도서관은 실시간 좌석 정보를 공개하지 않아요.<br>운영시간·휴관일은 도서관 홈페이지에서 확인해 주세요.</div>`
    : `<div class="lift empty" style="margin-top:16px">${esc(l.message || "지금은 좌석 정보가 없어요.")}<br>운영하는 날 다시 확인해 주세요.</div>`}
    ${l.link ? `<a class="btn btn-soft" style="width:100%;height:48px;margin-top:18px;font-size:14px" href="${esc(l.link)}" target="_blank" rel="noopener">좌석 배치도 보기 (도서관 사이트) ↗</a>` : ""}
    ${l.home ? `<a class="btn btn-soft" style="width:100%;height:48px;margin-top:18px;font-size:14px" href="${esc(l.home)}" target="_blank" rel="noopener">도서관 홈페이지 ↗</a>` : ""}
    ${l.status === "none" ? "" : `<div class="foot">좌석 수는 운영시간에 30분마다 모아 와요. 몇 번 자리가 비었는지는 도서관 사이트에서 볼 수 있어요.</div>`}`;
}
async function refreshSeats() { toast("좌석 정보를 다시 불러와요"); await loadSeats(); }
function viewLibrary() {
  if (!SEATS) { $view.innerHTML = `<h1 style="font-size:27px;font-weight:800">도서관</h1><div class="lift empty" style="margin-top:16px">좌석 정보를 아직 불러오지 못했어요. 잠시 후 다시 열어 주세요.</div>`; return; }
  const { g, list } = libList();
  const ago = minsAgo(SEATS.updated_at);
  const chip = (v, label) => `<button class="btn ${g === v ? "btn-3d" : "btn-soft"}" style="height:38px;font-size:13px;padding:0 14px;flex:0 0 auto" onclick="pickLibGu('${v}')">${label}</button>`;
  $view.innerHTML = `<h1 style="font-size:27px;font-weight:800">도서관</h1>
    <p style="font-size:13px;color:var(--muted);margin:6px 0 14px">열람실 빈자리 · ${agoText(ago)} 기준 · 운영시간에 30분마다 갱신</p>
    <div style="display:flex;gap:8px;overflow-x:auto;padding:2px 2px 12px">${chip("", "전체")}${GUS.map(x => chip(x, x)).join("")}</div>
    ${ago !== null && ago > 90 ? `<div class="lift empty" style="margin-bottom:12px">지금은 운영시간이 아니거나 정보가 갱신되지 않았어요. 정확한 좌석은 "실시간 좌석 보기"로 확인하세요.</div>` : ""}
    <div style="display:flex;flex-direction:column;gap:14px">${list.filter(l => l.status !== "none").map(libCard).join("") || `<div class="lift empty">이 지역에는 좌석 정보를 제공하는 도서관이 없어요.</div>`}</div>
    ${list.some(l => l.status === "none") ? `<section class="section"><div class="sec-head"><h2>좌석 정보가 없는 도서관</h2></div>
      <div class="lift list">${list.filter(l => l.status === "none").map(l => `<button class="school" onclick="go('library/${libKey(l)}')"><span class="tile t-lilac" style="width:40px;height:40px">${icon.book}</span>
        <div style="flex:1;min-width:0"><div class="nm">${esc(l.name)}</div><div class="ad">${esc(l.gu)} · 실시간 좌석 미제공</div></div><span style="color:var(--muted)">›</span></button>`).join("")}</div></section>` : ""}
    <div class="foot">데이터 · <a href="${esc(SEATS.source_url || "https://lib.yongin.go.kr")}" target="_blank" rel="noopener">용인시도서관 좌석현황</a><br>좌석 수는 수집 시점 기준이라 실제와 다를 수 있어요.</div>`;
}
function pickLibGu(v) { libGu = v; render(); }
function homeLibrary() {
  if (!SEATS) return "";
  const { g, list } = libList();
  const open = list.filter(l => l.status === "open" && l.rooms.length).slice(0, 3);
  if (!open.length) return "";
  const rows = open.map(l => { const r = l.rooms.reduce((a, x) => ({ left: a.left + x.left, total: a.total + x.total, used: a.used + x.used, wait: 0 }), { left: 0, total: 0, used: 0 });
    const [bar, ink] = seatColor(r);
    return `<button class="school" onclick="go('library/${libKey(l)}')"><span class="tile t-mint" style="width:40px;height:40px">${icon.book}</span>
      <div style="flex:1;min-width:0"><div class="nm">${esc(l.name)}</div><div class="seatbar" style="margin-top:8px;height:8px"><i style="width:${r.total ? Math.round(r.used / r.total * 100) : 0}%;background:${bar}"></i></div></div>
      <span style="font-size:13px;color:var(--muted);white-space:nowrap"><b style="font-size:17px;color:${ink}">${r.left}</b>석 남음</span></button>`; }).join("");
  return `<section class="section"><div class="sec-head"><h2>${esc(g || "용인")} 도서관 빈자리</h2><button onclick="go('library')">전체보기</button></div>
    <div class="lift list">${rows}</div></section>`;
}

// ---------- 화면: 아이 추가 / 수정 ----------
function viewKid(arg, pre) {
  const list = kids();
  const editing = list.find(k => k.id === arg);
  if (!editing && list.length >= MAX_KIDS) { toast(`아이는 ${MAX_KIDS}명까지 등록할 수 있어요`); return go("my"); }
  if (!kidForm || kidForm.key !== location.hash) kidForm = { key: location.hash, name: editing ? editing.name : (ORD[list.length] || "아이"), code: editing ? editing.code : (pre || ""), q: "", arm: false };
  const sc = kidForm.code && DATA.schools.find(s => s.code === kidForm.code);
  $view.innerHTML = `<button class="back glass" onclick="history.back()" aria-label="뒤로">${icon.back}</button>
    <h1 style="font-size:25px;font-weight:800;margin-top:14px">${editing ? "아이 정보 수정" : "아이 추가"}</h1>
    <p style="font-size:13px;color:var(--muted);margin:6px 0 0">이름 대신 첫째·둘째 같은 별명도 괜찮아요. 이 휴대폰에만 저장돼요.</p>
    <section class="section"><div class="sec-head"><h2>이름(별명)</h2></div>
      <label class="search lift"><input id="kname" maxlength="10" value="${esc(kidForm.name)}" aria-label="아이 이름 또는 별명"></label></section>
    <section class="section"><div class="sec-head"><h2>학교</h2></div>
      ${sc ? `<div class="lift" style="padding:16px;display:flex;align-items:center;gap:12px"><span class="tile t-sun" style="width:40px;height:40px">${icon.star}</span>
        <div style="flex:1;min-width:0"><div style="font-weight:700">${esc(sc.name)}</div><div style="font-size:12px;color:var(--muted)">${levelShort(sc)} · ${esc(sc.gu || "")} ${esc(sc.dong || "")}</div></div></div>` : ""}
      <label class="search lift">${icon.search}<input id="kq" placeholder="${sc ? "다른 학교로 바꾸기 (학교 이름 검색)" : "학교 이름 검색 (예: 마성, 수지중)"}" value="${esc(kidForm.q)}" aria-label="학교 이름 검색"></label>
      <div class="lift list" id="kres"></div></section>
    <button class="btn btn-3d" style="width:100%;height:54px;margin-top:24px;font-size:15px" onclick="saveKid('${editing ? editing.id : ""}')">${editing ? "저장하기" : "등록하기"}</button>
    ${editing ? `<button class="btn btn-soft" style="width:100%;height:46px;margin-top:12px;color:var(--coral-ink)" onclick="deleteKid('${editing.id}')">${kidForm.arm ? "한 번 더 누르면 삭제돼요" : "이 아이 삭제"}</button>` : ""}`;
  document.getElementById("kname").addEventListener("input", e => { kidForm.name = e.target.value; });
  document.getElementById("kq").addEventListener("input", e => { kidForm.q = e.target.value; kidResults(); });
  kidResults();
}
function kidResults() {
  const box = document.getElementById("kres"); if (!box) return;
  const q = kidForm.q.trim();
  if (!q) { box.style.display = "none"; return; }
  box.style.display = "";
  const res = DATA.schools.filter(s => s.name.includes(q)).slice(0, 20);
  box.innerHTML = res.map(s => `<button class="school ${s.code === kidForm.code ? "mine" : ""}" onclick="pickKidSchool('${s.code}')">
      <span class="pill pill-gray">${levelShort(s)}</span><div style="flex:1;min-width:0"><div class="nm">${esc(s.name)}</div><div class="ad">${esc(s.gu || "")} ${esc(s.dong || "")}</div></div></button>`).join("") || `<div class="empty">검색 결과가 없어요.</div>`;
}
function pickKidSchool(code) { kidForm.code = code; kidForm.q = ""; render(); }
function saveKid(id) {
  if (!kidForm.code) { toast("학교를 골라 주세요"); return; }
  const list = kids();
  const name = (kidForm.name || "").trim() || ORD[list.length] || "아이";
  const k = list.find(x => x.id === id);
  if (k) { k.name = name; k.code = kidForm.code; }
  else list.push({ id: "k" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6), name, code: kidForm.code, color: nextColor(list) });
  saveKids(list); kidForm = null; homeKid = "all";
  toast(k ? "저장했어요" : `${name}을(를) 등록했어요`); go("home");
}
function deleteKid(id) {
  if (!kidForm.arm) { kidForm.arm = true; render(); return; }
  saveKids(kids().filter(k => k.id !== id)); kidForm = null; toast("삭제했어요"); go("my");
}
function pickKid(id) { homeKid = id; render(); }

// ---------- 이동 / 동작 ----------
function go(route) { if (location.hash === "#" + route) render(); else location.hash = route; }
function render() {
  if (!DATA) return;
  const r = (location.hash || "#home").slice(1);
  const tab = r.startsWith("school") ? "schools" : r.startsWith("library") ? "library" : r === "my" || r === "region" || r.startsWith("kid/") ? "my" : "home";
  document.querySelectorAll(".navi").forEach(b => b.classList.toggle("on", b.dataset.tab === tab));
  if (r.startsWith("kid/")) { const p = r.split("/"); if (p[1] === "new") viewKid("", p[2] || ""); else viewKid(p[1]); }
  else if (r === "region") viewRegion();
  else if (r.startsWith("school/")) viewSchool(r.split("/")[1]);
  else if (r === "schools") viewSchools();
  else if (r === "library") viewLibrary();
  else if (r.startsWith("library/")) viewLibraryDetail(r.slice(8));
  else if (r === "my") viewMy();
  else viewHome();
  window.scrollTo(0, 0);
}
async function doInstall() { if (!installEvt) return; installEvt.prompt(); await installEvt.userChoice; installEvt = null; render(); }

document.querySelectorAll(".navi").forEach(b => b.addEventListener("click", () => go(b.dataset.tab)));
window.addEventListener("hashchange", render);
window.addEventListener("beforeinstallprompt", e => { e.preventDefault(); installEvt = e; render(); });

async function loadSeats() {
  try {
    const res = await fetch(SEATS_URL, { cache: "no-cache" });
    if (!res.ok) throw new Error(res.status);
    SEATS = await res.json(); store(KEY_SEATS, JSON.stringify(SEATS));
  } catch (e) { try { SEATS = JSON.parse(store(KEY_SEATS) || "null"); } catch (e2) { SEATS = null; } }
  if (DATA) render();
}
async function load() {
  loadSeats();
  try {
    const res = await fetch(DATA_URL, { cache: "no-cache" });
    if (!res.ok) throw new Error(res.status);
    DATA = await res.json();
    store(KEY_DATA, JSON.stringify(DATA));
  } catch (e) {
    const saved = store(KEY_DATA);
    if (saved) { DATA = JSON.parse(saved); toast("인터넷 연결이 없어 저장된 정보를 보여드려요"); }
    else { $view.innerHTML = `<div class="loading">정보를 불러오지 못했어요.<br>인터넷 연결을 확인하고 다시 열어 주세요.</div>`; return; }
  }
  render();
}
load();
if ("serviceWorker" in navigator) window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
</script>
</body>
</html>
