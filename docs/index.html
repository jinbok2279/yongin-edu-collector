<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#5161F7">
<title>아이랑 용인 · 새 주소로 이동 중</title>
<link rel="icon" href="icon-192.png">
<style>
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans KR",sans-serif;background:#EEF1F8;color:#1A1D2E;display:flex;min-height:100vh;align-items:center;justify-content:center}
  .box{background:#fff;border-radius:24px;padding:28px 24px;max-width:340px;margin:16px;text-align:center;box-shadow:0 10px 30px -12px rgba(30,40,90,.25)}
  img{width:64px;height:64px;border-radius:16px}
  h1{font-size:19px;margin:14px 0 6px}
  p{font-size:14px;line-height:1.6;color:#5A5F78;margin:0}
  a{display:inline-block;margin-top:18px;padding:12px 20px;border-radius:14px;background:#5161F7;color:#fff;font-weight:700;text-decoration:none}
</style>
</head>
<body>
<div class="box">
  <img src="icon-192.png" alt="">
  <h1>아이랑 용인이 새 주소로 옮겼어요</h1>
  <p>잠시 후 자동으로 이동해요.<br>등록한 아이 정보도 함께 옮겨져요.</p>
  <a id="go" href="https://yongin.songgollab.co.kr/">새 주소로 가기</a>
</div>
<script>
// 이 휴대폰(브라우저)에 저장된 아이랑 용인 설정만 모아 새 주소로 넘김 (주소 # 뒤에만 실려 서버로 가지 않음)
(function () {
  var TARGET = "https://yongin.songgollab.co.kr/";
  var SKIP = /^edu\.(admin|adminPin|data|seats|events|books|meals|acas|kinder|jobs|elite)$/;
  var out = {}, n = 0;
  try {
    for (var i = 0; i < localStorage.length; i++) {
      var k = localStorage.key(i);
      if (!/^edu\./.test(k) || SKIP.test(k)) continue;
      var v = localStorage.getItem(k);
      if (v == null || v.length > 4000) continue;
      out[k] = v; n++;
    }
  } catch (e) {}
  var url = TARGET;
  if (n) {
    var bytes = new TextEncoder().encode(JSON.stringify(out)), bin = "";
    for (var j = 0; j < bytes.length; j++) bin += String.fromCharCode(bytes[j]);
    url += "#import=" + btoa(bin).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
  }
  document.getElementById("go").href = url;
  setTimeout(function () { location.replace(url); }, 600);
})();
</script>
</body>
</html>
