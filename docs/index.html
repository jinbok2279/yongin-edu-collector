<style>
:root{
  --ink:#141A2E;--muted:#5C6478;--line:#EEF0F6;--ground:#EEF1F8;
  --indigo:#4B5BF0;--indigo-ink:#3442C9;--coral-ink:#C93D22;--coral-bg:#FFE9E2;
  --mint-ink:#13795F;--mint-bg:#E2F6F0;--sun-ink:#8A5300;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--ground);color:var(--ink);font-family:'Noto Sans KR',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100vh}
button,input{font-family:inherit}
a{color:var(--indigo);text-decoration:none}
.bg{position:fixed;inset:0;z-index:-1;background:radial-gradient(circle at 90% 4%,rgba(150,135,255,.38),transparent 42%),radial-gradient(circle at 0% 62%,rgba(110,220,195,.26),transparent 45%),var(--ground)}
.wrap{max-width:560px;margin:0 auto;padding:20px 18px calc(110px + env(safe-area-inset-bottom))}
.lift{background:#fff;border-radius:24px;box-shadow:inset 0 1px 0 #fff,0 1px 2px rgba(20,26,46,.05),0 14px 30px -12px rgba(43,52,120,.24)}
.glass{background:rgba(255,255,255,.66);backdrop-filter:blur(20px) saturate(1.4);-webkit-backdrop-filter:blur(20px) saturate(1.4);border:1px solid rgba(255,255,255,.85)}
.tile{display:inline-flex;align-items:center;justify-content:center;color:#fff;border-radius:14px;flex:0 0 auto;box-shadow:inset 0 2px 1px rgba(255,255,255,.55),inset 0 -4px 8px rgba(0,0,0,.16),0 10px 18px -6px var(--sh)}
.t-indigo{background:linear-gradient(155deg,#9AA4FF,#5B6BFF 45%,#3B47D6);--sh:rgba(75,91,240,.6)}
.t-coral{background:linear-gradient(155deg,#FFBBA5,#FF7A59 50%,#DD4E33);--sh:rgba(255,122,89,.6)}
.t-mint{background:linear-gradient(155deg,#9BF0DC,#2FC4A4 50%,#16917A);--sh:rgba(43,181,154,.55)}
.t-sun{background:linear-gradient(155deg,#FFE9A6,#FFC53D 50%,#E79B00);--sh:rgba(240,170,20,.55)}
.mgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px 6px;padding:18px 10px}
.mgrid button{border:0;background:none;font:inherit;color:var(--ink);display:flex;flex-direction:column;align-items:center;gap:7px;cursor:pointer;padding:0;position:relative}
.mgrid .tile{width:48px;height:48px;font-size:22px}

.orb-sun{border-radius:50%;background:radial-gradient(circle at 30% 26%,#fff 0%,#FFF1C4 14%,#FFD15A 45%,#F2A900 78%,#C98500 100%);box-shadow:0 18px 26px -12px rgba(30,10,80,.55)}

.btn-3d{background:linear-gradient(180deg,#6876FF,#4B5BF0);color:#fff;box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 4px 0 #3340C4,0 12px 18px -8px rgba(75,91,240,.6)}

.seg{display:flex;background:#E4E8F2;border-radius:16px;padding:4px;gap:4px;box-shadow:inset 0 2px 4px rgba(20,26,46,.08);margin:14px 0 16px}

.book{display:flex;gap:14px;align-items:center;padding:12px 14px;text-decoration:none;color:inherit;border-bottom:1px solid var(--line)}

.book .cv{width:52px;height:74px;border-radius:8px;object-fit:cover;background:#E4E8F2;box-shadow:0 6px 12px rgba(20,26,46,.18);flex:0 0 auto}
.book .tt{font-size:14px;font-weight:700;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.book .au{font-size:12px;color:var(--muted);margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.shelf{display:flex;gap:12px;overflow-x:auto;padding:4px 2px 10px}
.shelf a{flex:0 0 92px;text-decoration:none;color:inherit;position:relative}
.shelf img,.shelf .ph{width:92px;height:132px;border-radius:10px;object-fit:cover;background:#E4E8F2;box-shadow:0 8px 16px rgba(20,26,46,.18);display:block}
.shelf .no{position:absolute;left:6px;top:6px;min-width:22px;height:22px;border-radius:11px;background:var(--indigo);color:#fff;font-size:12px;font-weight:800;display:flex;align-items:center;justify-content:center;padding:0 6px}
.shelf .tt{font-size:12px;font-weight:700;margin-top:8px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.stat{background:#F5F7FC;border-radius:14px;padding:10px 6px;text-align:center;box-shadow:inset 0 1px 2px rgba(20,26,46,.06)}
.stat .k{font-size:11px;color:var(--muted)}.stat .v{font-size:18px;font-weight:800;margin-top:2px}
.dots{display:grid;grid-template-columns:repeat(auto-fill,minmax(11px,1fr));gap:3px}
.dots i{display:block;aspect-ratio:1;border-radius:3px;border:1.5px solid var(--dot);background:#fff}
.dots i.u{background:var(--dot);border-color:var(--dot-ink)}
.loading{padding:60px 0;text-align:center;color:var(--muted);font-size:14px}
</style>

<script>
// 수집 데이터: 이 사이트의 data/ 폴더에서 먼저 받고, 없으면 GitHub 원본에서 받기
const RAW = "https://raw.githubusercontent.com/jinbok2279/yongin-edu-collector/main/output/";
function dataFetch(name) {
  return fetch("./data/" + name, { cache: "no-cache" }).then(r => r.ok ? r : Promise.reject(r.status))
    .catch(() => fetch(RAW + name, { cache: "no-cache" }));
}
// 접속 통계 (GoatCounter · 쿠키/개인정보 없음)
let lastTracked = "";
function gc(fn, tries = 0) { if (store("edu.admin")) return; if (window.goatcounter && window.goatcounter.count) fn(window.goatcounter); else if (tries < 20) setTimeout(() => gc(fn, tries + 1), 500); }
function trackView(route) {
  const path = "/" + route.replace(/^kid\/(?!new).*/, "kid/edit").replace(/^kid\/new\/.*/, "kid/new");
  if (path === lastTracked) return; lastTracked = path;
  gc(g => g.count({ path, title: document.title }));
}
function trackEvent(name) { gc(g => g.count({ path: name, title: name, event: true })); }
const DATA_URL = "latest.json";
const KEY_SCHOOL = "edu.school";
const SEATS_URL = "seats.json";
const KEY_SEATS = "edu.seats";
let SEATS = null;
const EVENTS_URL = "events.json";
const KEY_EVENTS = "edu.events";
let EVENTS = null, evTab = "city";
const BOOKS_URL = "books.json";
const KEY_BOOKS = "edu.books";
let BOOKS = null;
const ACAS_URL = "academies.json";
let ACAS = null, acasLoading = null;
function loadAcas() {
  if (ACAS) return Promise.resolve(ACAS);
  if (!acasLoading) acasLoading = dataFetch(ACAS_URL).then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
    .then(j => (ACAS = j)).catch(e => { acasLoading = null; throw e; });
  return acasLoading;
}
const KEY_DATA = "edu.data";
const KEY_REGION = "edu.region";
const GUS = ["수지구", "기흥구", "처인구"];
const KEY_LEVEL = "edu.level";
const LEVELS = [["초등학교", "초등"], ["중학교", "중등"], ["고등학교", "고등"]];
const IMPORTANT = /휴업|방학|개학|졸업|입학|체험|기념일|운동회|한마당|발표회|축제|상담|공개수업/;
const WD = ["일","월","화","수","목","금","토"];
const $view = document.getElementById("view");
let DATA = null;
let installEvt = null;

function store(k, v) { try { if (v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); } catch (e) { return null; } }
function esc(s) { return String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c])); }
function toast(msg) { const t = document.getElementById("toast"); t.textContent = msg; t.classList.add("show"); setTimeout(() => t.classList.remove("show"), 1800); }

function parseDate(s) { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); }
function today() { const n = new Date(); return new Date(n.getFullYear(), n.getMonth(), n.getDate()); }
function dday(s) { return Math.round((parseDate(s) - today()) / 86400000); }
function ddayText(n) { return n === 0 ? "오늘" : n > 0 ? `D-${n}` : `D+${-n}`; }
function md(s) { const d = parseDate(s); return `${d.getMonth() + 1}.${d.getDate()}`; }
function mdw(s) { const d = parseDate(s); return `${d.getMonth() + 1}.${d.getDate()} (${WD[d.getDay()]})`; }

// 같은 이름의 연속 일정(예: ○○ 주간)을 하나로 묶기
function group(events) {
  const out = [];
  [...events].sort((a, b) => a.date.localeCompare(b.date) || a.name.localeCompare(b.name)).forEach(e => {
    const prev = out.find(g => g.name === e.name && (parseDate(e.date) - parseDate(g.end)) / 86400000 <= 3);
    if (prev) prev.end = e.date; else out.push({ ...e, end: e.date });
  });
  return out.sort((a, b) => a.date.localeCompare(b.date));
}
function upcoming(list) { return list.filter(g => dday(g.end) >= 0); }

// ---------- 지역(구 · 읍면동) ----------
function region() { try { return JSON.parse(store(KEY_REGION) || "{}"); } catch (e) { return {}; } }
function setRegion(gu, dong) { store(KEY_REGION, JSON.stringify({ gu: gu || "", dong: dong || "" })); }
function dongOf(s) { return s.dong || "기타"; }
function levelOf(s) { return s.level || "초등학교"; }
function level() { const v = store(KEY_LEVEL); return LEVELS.some(l => l[0] === v) ? v : "초등학교"; }
function levelLabel() { return (LEVELS.find(l => l[0] === level()) || LEVELS[0])[1]; }
function levelSchools() { return DATA.schools.filter(s => levelOf(s) === level()); }
function inRegion(s) { const r = region(); return levelOf(s) === level() && (!r.gu || s.gu === r.gu) && (!r.dong || dongOf(s) === r.dong); }
function regionLabel() { const r = region(); return r.gu ? `용인 ${r.gu}${r.dong ? " " + r.dong : ""}` : "용인시 전체"; }
function regionSchools() { return DATA.schools.filter(inRegion); }

// ---------- 우리 아이(여러 명) ----------
const KEY_KIDS = "edu.kids";
const KID_TILES = ["t-indigo", "t-coral", "t-mint", "t-sun", "t-lilac"];
const KID_PILLS = [["#3442C9", "#ECEEFF"], ["#C93D22", "#FFE9E2"], ["#13795F", "#E2F6F0"], ["#8A5300", "#FFF1CC"], ["#6436BE", "#F1E8FF"]];
const ORD = ["첫째", "둘째", "셋째", "넷째", "다섯째"];
const MAX_KIDS = 5;
let homeKid = "all";
let kidForm = null;
function saveKids(list) { store(KEY_KIDS, JSON.stringify(list)); }
function kids() {
  let list = [];
  try { list = JSON.parse(store(KEY_KIDS) || "[]"); } catch (e) { list = []; }
  if (!list.length) {                      // 예전 버전의 "우리 아이 학교"를 첫 번째 아이로 옮기기
    const c = store(KEY_SCHOOL);
    if (c) { list = [{ id: "k" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6), name: "우리 아이", code: c, color: 0 }]; saveKids(list); store(KEY_SCHOOL, ""); }
  }
  return list;
}
function kidSchool(k) { return DATA.schools.find(s => s.code === k.code); }
function nextColor(list) { for (let i = 0; i < KID_TILES.length; i++) if (!list.some(k => k.color === i)) return i; return list.length % KID_TILES.length; }
function kidPill(k) { const [c, b] = KID_PILLS[k.color % KID_PILLS.length]; return `<span class="pill" style="color:${c};background:${b};margin-right:6px">${esc(k.name)}</span>`; }
// 학년: 등록한 해 기준으로 저장하고, 3월마다 자동으로 한 학년씩 올라감
function schoolYear(d = new Date()) { return d.getMonth() >= 2 ? d.getFullYear() : d.getFullYear() - 1; }
function maxGrade(s) { return levelOf(s) === "초등학교" ? 6 : 3; }
function kidGrade(k) { if (!k.grade) return 0; return k.grade + (schoolYear() - (k.gy || schoolYear())); }
function kidGradeText(k, sc) { const g = kidGrade(k); if (!g || !sc) return ""; return g > maxGrade(sc) ? "졸업·진학 확인" : `${g}학년`; }
function levelShort(s) { return { "초등학교": "초등", "중학교": "중등", "고등학교": "고등" }[levelOf(s)] || ""; }
function kidEvents(filter) {
  const rows = [];
  kids().filter(k => filter === "all" || k.id === filter).forEach(k => {
    const s = kidSchool(k); if (!s) return;
    upcoming(group(s.events || [])).forEach(g => rows.push({ ...g, kid: k, school: s.name }));
  });
  upcoming(group((DATA.public_holidays || []).map(p => ({ ...p, holiday: true, pub: true })))).forEach(g => rows.push(g));
  return rows.sort((a, b) => a.date.localeCompare(b.date) || ((a.kid ? a.kid.color : -1) - (b.kid ? b.kid.color : -1)));
}
function schoolEvents(s) {
  const pub = (DATA.public_holidays || []).map(p => ({ ...p, holiday: true, pub: true }));
  return upcoming(group([...(s.events || []), ...pub]));
}

function evRow(g, sub, tag) {
  const n = dday(g.date);
  const range = g.end !== g.date ? `${mdw(g.date)} ~ ${md(g.end)}` : mdw(g.date);
  const d = parseDate(g.date);
  const pill = g.holiday ? `<span class="pill pill-coral">${g.pub ? "공휴일" : "휴업"}</span>`
    : `<span class="pill ${n <= 7 ? "pill-indigo" : "pill-gray"}">${ddayText(n)}</span>`;
  return `<div class="ev">
    <div class="datebox ${g.holiday ? "hol" : ""}"><b>${d.getDate()}</b><span>${d.getMonth() + 1}월 ${WD[d.getDay()]}</span></div>
    <div class="ev-body"><div class="ev-name">${esc(g.name)}</div><div class="ev-sub">${tag || ""}${esc(sub || range)}</div></div>
    ${pill}
  </div>`;
}

function regionHighlights() {
  const rows = [];
  regionSchools().forEach(s => group(s.events || []).forEach(g => {
    if ((g.holiday || IMPORTANT.test(g.name)) && dday(g.end) >= 0) rows.push({ ...g, school: s.name, code: s.code });
  }));
  return rows.sort((a, b) => a.date.localeCompare(b.date));
}

// ---------- 화면: 홈 ----------
function viewHome() {
  const ks = kids();
  if (homeKid !== "all" && !ks.some(k => k.id === homeKid)) homeKid = "all";
  const now = new Date();
  const dateStr = `${now.getMonth() + 1}월 ${now.getDate()}일 ${WD[now.getDay()]}요일`;
  let hero, mine = "";
  if (ks.length) {
    const evs = kidEvents(homeKid);
    const next = evs.find(g => !g.pub);
    const one = homeKid !== "all" ? ks.find(k => k.id === homeKid) : ks.length === 1 ? ks[0] : null;
    const oneSchool = one && kidSchool(one);
    const title = one ? `${one.name}\n${oneSchool ? oneSchool.name : "학교 정보 없음"}` : `우리 아이 ${ks.length}명\n다가오는 일정`;
    const nextTxt = next ? `다음 일정 · ${one ? "" : next.kid.name + " "}${next.name}` : "예정된 학교 일정이 없어요";
    const cta = one && oneSchool ? `<button class="cta" onclick="go('school/${oneSchool.code}')">학교 일정 전체 보기 →</button>` : `<button class="cta" onclick="go('my')">아이 관리 →</button>`;
    hero = `<section class="hero"><div class="glow"></div>
      <div class="date">${dateStr}</div>
      <h1>${esc(title)}</h1>
      <p class="next">${esc(nextTxt)}</p>
      ${cta}
      ${next ? `<div class="dday"><b>${ddayText(dday(next.date))}</b><span>${mdw(next.date)}</span></div>` : `<div class="deco fl"><div class="orb-sun" style="width:56px;height:56px"></div></div>`}
    </section>`;
    const chip = (id, label, extra = "") => `<button class="btn ${homeKid === id ? "btn-3d" : "btn-soft"}" style="height:38px;font-size:13px;padding:0 14px;flex:0 0 auto" onclick="pickKid('${id}')">${extra}${esc(label)}</button>`;
    const chips = ks.length > 1 ? `<div style="display:flex;gap:8px;overflow-x:auto;padding:2px 2px 10px">${chip("all", "전체")}${ks.map(k => chip(k.id, k.name, `<span class="tile ${KID_TILES[k.color % 5]}" style="width:18px;height:18px;border-radius:6px"></span>`)).join("")}</div>` : "";
    const list = evs.slice(0, 8);
    const ownCount = ks.filter(k => homeKid === "all" || k.id === homeKid).reduce((n, k) => n + (((kidSchool(k) || {}).events || []).length), 0);
    mine = `<section class="section"><div class="sec-head"><h2>우리 아이 다가오는 일정</h2>${ks.length < MAX_KIDS ? `<button onclick="go('kid/new')">+ 아이 추가</button>` : ""}</div>
      ${chips}
      <div class="lift card-pad">${list.map(g => g.kid ? evRow(g, `${g.school} · ${g.end !== g.date ? mdw(g.date) + " ~ " + md(g.end) : mdw(g.date)}`, ks.length > 1 ? kidPill(g.kid) : "") : evRow(g)).join("")}
      ${ownCount ? "" : `<div class="empty">학교가 아직 나이스에 학사일정을 많이 등록하지 않았어요. 등록되면 자동으로 여기에 나타나요.</div>`}</div></section>`;
  } else {
    hero = `<section class="hero"><div class="glow"></div>
      <div class="date">${dateStr}</div>
      <h1>우리 아이를\n등록해 주세요</h1>
      <p class="next">형제자매가 여러 명이어도 한 번에 볼 수 있어요</p>
      <button class="cta" onclick="go('kid/new')">아이 등록하기 →</button>
      <div class="deco fl"><div class="orb-sun" style="width:58px;height:58px"></div></div>
    </section>`;
  }

  const install = installEvt ? `<button class="btn btn-soft" style="height:40px;font-size:12px" onclick="doInstall()">앱으로 설치</button>` : "";
  $view.innerHTML = `<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">
      <button class="chip glass" onclick="go('region')">${icon.pin} ${esc(regionLabel())} · ${levelLabel()} ▾</button>${install}</div>
    ${hero}${mine}${homeEvents()}${homeLibrary()}${homeBooks()}${footer()}`;
}

// ---------- 화면: 학교 목록 ----------
function viewSchools(q = "") {
  const kidCodes = new Set(kids().map(k => k.code));
  const base = q ? levelSchools() : regionSchools();
  const list = base.filter(s => !q || s.name.includes(q) || s.address.includes(q) || (s.dong || "").includes(q));
  const tileCls = { "수지구": "t-mint", "기흥구": "t-indigo", "처인구": "t-coral" };
  const rows = list.map(s => {
    const next = upcoming(group(s.events || []))[0];
    const mineS = kidCodes.has(s.code);
    const tile = mineS ? `<span class="tile t-sun" style="width:40px;height:40px">${icon.star}</span>` : `<span class="tile ${tileCls[s.gu] || "t-lilac"}" style="width:40px;height:40px;font-weight:800">${esc(s.name.replace("용인", "")[0])}</span>`;
    return `<button class="school ${mineS ? "mine" : ""}" onclick="go('school/${s.code}')">${tile}
      <div style="flex:1;min-width:0"><div class="nm">${esc(s.name)}</div><div class="ad">${esc(s.gu || "")}${s.dong ? " " + esc(s.dong) : ""} · ${next ? esc(mdw(next.date) + " " + next.name) : "등록된 일정 없음"}</div></div>
      <span style="color:#8A91A5">›</span></button>`;
  }).join("");
  $view.innerHTML = `<button class="back glass" onclick="go('home')" aria-label="홈으로">${icon.back}</button>
    <h1 style="font-size:27px;font-weight:800;margin-top:14px">학교 일정</h1>
    <div style="display:flex;justify-content:space-between;align-items:center;margin:8px 0 16px;gap:10px">
      <span style="font-size:13px;color:var(--muted)">${q ? "용인시 전체에서 검색" : esc(regionLabel())} · ${level()} ${list.length}곳</span>
      <button class="btn btn-soft" style="height:36px;font-size:12px;padding:0 12px" onclick="go('region')">지역 변경</button></div>
    <label class="search lift">${icon.search}<input id="q" placeholder="학교 이름 검색" value="${esc(q)}" aria-label="학교 이름 검색"></label>
    <div class="lift list" style="margin-top:16px">${rows || `<div class="empty">검색 결과가 없어요.</div>`}</div>${footer()}`;
  const inp = document.getElementById("q");
  inp.addEventListener("input", () => { const v = inp.value; viewSchools(v); const n = document.getElementById("q"); n.focus(); n.setSelectionRange(v.length, v.length); });
}

function viewRegion() {

  const guBtn = (gu, label) => {
    const on = (r.gu || "") === gu;
    return `<button class="btn ${on ? "btn-3d" : "btn-soft"}" style="flex:1;min-width:0;flex-direction:column;height:64px;gap:2px" onclick="pickGu('${gu}')">
      <span>${label}</span><span style="font-size:11px;font-weight:500;opacity:.85">${cnt(gu)}곳</span></button>`;
  };
  let dongs = "";
  if (r.gu) {
    const map = {};
    levelSchools().filter(s => s.gu === r.gu).forEach(s => { map[dongOf(s)] = (map[dongOf(s)] || 0) + 1; });
    const names = Object.keys(map).sort((a, b) => (a === "기타") - (b === "기타") || a.localeCompare(b, "ko"));
    const chip = (d, label, n) => `<button class="btn ${(r.dong || "") === d ? "btn-3d" : "btn-soft"}" style="height:40px;font-size:13px;padding:0 14px" onclick="pickDong('${d}')">${esc(label)} <span style="font-weight:500;opacity:.8">${n}</span></button>`;

      <div style="display:flex;flex-wrap:wrap;gap:10px 8px">${chip("", r.gu + " 전체", cnt(r.gu))}${names.map(d => chip(d, d, map[d])).join("")}</div></section>`;
  }
  $view.innerHTML = `<button class="back glass" onclick="go('home')" aria-label="뒤로">${icon.back}</button>
    <h1 style="font-size:25px;font-weight:800;margin-top:14px">학교급 · 지역 설정</h1>
    <p style="font-size:13px;color:var(--muted);margin:6px 0 0">고른 학교급과 지역의 학교·일정만 모아서 보여드려요.</p>
    <section class="section"><div class="sec-head"><h2>학교급</h2></div>
      <div style="display:flex;gap:8px">${LEVELS.map(([k, label]) => {
        const on = level() === k; const n = DATA.schools.filter(s => levelOf(s) === k).length;
        return `<button class="btn ${on ? "btn-3d" : "btn-soft"}" style="flex:1;min-width:0;flex-direction:column;height:64px;gap:2px" onclick="pickLevel('${k}')"><span>${label}</span><span style="font-size:11px;font-weight:500;opacity:.85">${n}곳</span></button>`;
      }).join("")}</div></section>
    <section class="section"><div class="sec-head"><h2>구</h2></div>
      <div style="display:flex;gap:8px">${guBtn("", "전체")}${GUS.map(g => guBtn(g, g)).join("")}</div></section>
    ${dongs}
    <button class="btn btn-3d" style="width:100%;height:54px;margin-top:28px;font-size:15px" onclick="go('home')">이 지역으로 보기 · ${esc(regionLabel())}</button>`;

}
async function doInstall() { if (!installEvt) return; installEvt.prompt(); const ch = await installEvt.userChoice; if (ch && ch.outcome === "accepted") trackEvent("앱-설치"); installEvt = null; render(); }

document.querySelectorAll(".navi").forEach(b => b.addEventListener("click", () => go(b.dataset.tab)));
window.addEventListener("hashchange", render);
window.addEventListener("beforeinstallprompt", e => { e.preventDefault(); installEvt = e; render(); });

async function loadSeats() {
  try {
    const res = await dataFetch(SEATS_URL);
    if (!res.ok) throw new Error(res.status);
    SEATS = await res.json(); store(KEY_SEATS, JSON.stringify(SEATS));
  } catch (e) { try { SEATS = JSON.parse(store(KEY_SEATS) || "null"); } catch (e2) { SEATS = null; } }
  if (DATA) render();
}
async function loadBooks() {
  try {
    const res = await dataFetch(BOOKS_URL);
    if (!res.ok) throw new Error(res.status);
    BOOKS = await res.json(); store(KEY_BOOKS, JSON.stringify(BOOKS));
  } catch (e) { try { BOOKS = JSON.parse(store(KEY_BOOKS) || "null"); } catch (e2) { BOOKS = null; } }
  if (DATA) render();
}
async function loadEvents() {
  try {
    const res = await dataFetch(EVENTS_URL);
    if (!res.ok) throw new Error(res.status);
    EVENTS = await res.json(); store(KEY_EVENTS, JSON.stringify(EVENTS));
  } catch (e) { try { EVENTS = JSON.parse(store(KEY_EVENTS) || "null"); } catch (e2) { EVENTS = null; } }
  if (DATA) render();
}
async function load() {
  loadSeats(); loadBooks(); loadEvents();
  try {
    const res = await dataFetch(DATA_URL);
    if (!res.ok) throw new Error(res.status);
    DATA = await res.json();
    store(KEY_DATA, JSON.stringify(DATA));
  } catch (e) {
    const saved = store(KEY_DATA);
    if (saved) { DATA = JSON.parse(saved); toast("인터넷 연결이 없어 저장된 정보를 보여드려요"); }
    else { $view.innerHTML = `<div class="loading">정보를 불러오지 못했어요.<br>인터넷 연결을 확인하고 다시 열어 주세요.</div>`; return; }
  }
  render();
}
load();
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").then(r => r.update()).catch(() => {}));
  // 새 버전이 설치되면 한 번 자동으로 새로고침
  let swReloaded = false; const hadSW = !!navigator.serviceWorker.controller;
  navigator.serviceWorker.addEventListener("controllerchange", () => { if (swReloaded || !hadSW) return; swReloaded = true; location.reload(); });
}
</script>
